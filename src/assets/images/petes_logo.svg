<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 890" width="800" height="890">
  <defs>
    <!-- Path for curved FAMILY FITNESS text on top ribbon -->
    <path id="topRibbonTextPath" d="M 215 156 A 255 255 0 0 1 585 156" fill="none" />
    
    <!-- Path for curved PETE'S FITNESS FACTORY text on weight plate -->
    <path id="plateTextPath" d="M 252 386 A 150 150 0 0 1 548 386" fill="none" />
    
    <!-- Path for curved CHOOSE IT WISELY text on bottom ribbon -->
    <path id="bottomRibbonTextPath" d="M 215 628 A 285 285 0 0 0 585 628" fill="none" />
  </defs>

  <style>
    .athletic-font {
      font-family: 'Oswald', -apple-system, BlinkMacSystemFont, 'Impact', sans-serif;
      font-weight: 800;
      text-anchor: middle;
    }
    .gym-font {
      font-family: 'Oswald', 'Impact', sans-serif;
      font-weight: 900;
      text-anchor: middle;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="800" height="890" fill="#ffffff" />

  <!-- Outer combined badge outline (circle + bottom rectangle) matching user upload -->
  <!-- Outer circle contour -->
  <path d="M 205 620 A 340 340 0 1 1 595 620 L 595 845 L 205 845 Z" fill="#ffffff" stroke="#18181b" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner circle contour -->
  <circle cx="400" cy="380" r="328" fill="none" stroke="#18181b" stroke-width="1.2" />

  <!-- ==================== TOP RIBBON: FAMILY FITNESS ==================== -->
  <!-- Left Ribbon Tail with fold and swallowtail cut -->
  <g fill="#18181b">
    <path d="M 195 150 L 135 125 L 190 200 L 130 225 L 210 195 Z" stroke="#18181b" stroke-width="1.5" />
    <path d="M 190 200 L 225 185 L 210 195 Z" fill="#333333" />
  </g>
  <!-- Right Ribbon Tail with fold and swallowtail cut -->
  <g fill="#18181b">
    <path d="M 605 150 L 665 125 L 610 200 L 670 225 L 590 195 Z" stroke="#18181b" stroke-width="1.5" />
    <path d="M 610 200 L 575 185 L 590 195 Z" fill="#333333" />
  </g>

  <!-- Arched Black Ribbon Body -->
  <path d="M 190 156 C 285 90, 515 90, 610 156 L 592 215 C 505 152, 295 152, 208 215 Z" fill="#18181b" stroke="#18181b" stroke-width="2" />
  <!-- Inner White Border along the top ribbon -->
  <path d="M 202 163 C 292 102, 508 102, 598 163 L 588 206 C 502 147, 298 147, 212 206 Z" fill="none" stroke="#ffffff" stroke-width="1.6" />

  <!-- Curved Text: FAMILY FITNESS -->
  <text fill="#ffffff" font-size="34" letter-spacing="4.5" class="athletic-font">
    <textPath href="#topRibbonTextPath" startOffset="50%">
      FAMILY FITNESS
    </textPath>
  </text>

  <!-- ==================== STARS: 19 and 98 ==================== -->
  <!-- Left Star (19) -->
  <g transform="translate(170, 360)">
    <polygon points="0,-46 13,-14 46,-14 19,6 29,38 0,20 -29,38 -19,6 -46,-14 -13,-14" fill="#18181b" />
    <text x="0" y="10" fill="#ffffff" font-size="26" class="athletic-font">19</text>
  </g>

  <!-- Right Star (98) -->
  <g transform="translate(630, 360)">
    <polygon points="0,-46 13,-14 46,-14 19,6 29,38 0,20 -29,38 -19,6 -46,-14 -13,-14" fill="#18181b" />
    <text x="0" y="10" fill="#ffffff" font-size="26" class="athletic-font">98</text>
  </g>

  <!-- ==================== CENTER WEIGHT PLATE ==================== -->
  <!-- Outer rim of barbell plate -->
  <circle cx="400" cy="380" r="176" fill="#18181b" stroke="#18181b" stroke-width="3" />
  <circle cx="400" cy="380" r="164" fill="none" stroke="#ffffff" stroke-width="3.2" />
  <circle cx="400" cy="380" r="156" fill="none" stroke="#ffffff" stroke-width="1.2" />

  <!-- Inner plate circle dividing groove -->
  <circle cx="400" cy="380" r="126" fill="#18181b" stroke="#ffffff" stroke-width="2.2" />

  <!-- Curved Text on Plate: PETE'S FITNESS FACTORY -->
  <text fill="#ffffff" font-size="19" letter-spacing="3" class="athletic-font">
    <textPath href="#plateTextPath" startOffset="50%">
      PETE'S FITNESS FACTORY
    </textPath>
  </text>

  <!-- 3 Distinct Grip Openings (Ergonomic Cutouts) -->
  <!-- Top Grip -->
  <path d="M 370 280 Q 400 270 430 280 Q 436 304 424 310 Q 400 298 376 310 Q 364 304 370 280 Z" fill="#ffffff" stroke="#18181b" stroke-width="1.5" />
  <!-- Bottom-Left Grip -->
  <path d="M 302 415 Q 312 445 338 460 Q 324 476 302 456 Q 290 435 302 415 Z" fill="#ffffff" stroke="#18181b" stroke-width="1.5" />
  <!-- Bottom-Right Grip -->
  <path d="M 498 415 Q 488 445 462 460 Q 476 476 498 456 Q 510 435 498 415 Z" fill="#ffffff" stroke="#18181b" stroke-width="1.5" />

  <!-- Center Hub with Center Hole -->
  <circle cx="400" cy="380" r="50" fill="#18181b" stroke="#ffffff" stroke-width="5" />
  <circle cx="400" cy="380" r="26" fill="#ffffff" stroke="#18181b" stroke-width="2" />
  <circle cx="400" cy="380" r="14" fill="#18181b" />

  <!-- ==================== BOTTOM RIBBON: CHOOSE IT WISELY ==================== -->
  <!-- Left Ribbon Tail with fold and swallowtail cut -->
  <g fill="#18181b">
    <path d="M 210 550 L 140 525 L 195 595 L 140 620 L 205 600 Z" stroke="#18181b" stroke-width="1.5" />
    <path d="M 195 595 L 225 580 L 205 600 Z" fill="#333333" />
  </g>
  <!-- Right Ribbon Tail with fold and swallowtail cut -->
  <g fill="#18181b">
    <path d="M 590 550 L 660 525 L 605 595 L 660 620 L 595 600 Z" stroke="#18181b" stroke-width="1.5" />
    <path d="M 605 595 L 575 580 L 595 600 Z" fill="#333333" />
  </g>

  <!-- Arched Bottom Ribbon Body (Curving upward towards the plate) -->
  <path d="M 205 545 C 300 605, 500 605, 595 545 L 608 604 C 510 672, 290 672, 192 604 Z" fill="#18181b" stroke="#18181b" stroke-width="2" />
  <!-- Inner White Border on Bottom Ribbon -->
  <path d="M 216 554 C 305 611, 495 611, 584 554 L 596 594 C 504 657, 296 657, 204 594 Z" fill="none" stroke="#ffffff" stroke-width="1.6" />

  <!-- Curved Text: CHOOSE IT WISELY -->
  <text fill="#ffffff" font-size="31" letter-spacing="4" class="athletic-font">
    <textPath href="#bottomRibbonTextPath" startOffset="50%">
      CHOOSE IT WISELY
    </textPath>
  </text>

  <!-- ==================== BOTTOM TAB: GYM ==================== -->
  <rect x="205" y="625" width="390" height="220" fill="#ffffff" stroke="#18181b" stroke-width="2.5" />

  <!-- Ultra-Bold Condensed Word: GYM (Vector Outlines for 100% exact rendering) -->
  <!-- Letter G -->
  <g fill="#18181b">
    <path d="M 255 650 L 330 650 L 330 682 L 288 682 C 288 682 288 778 288 778 L 330 778 L 330 735 L 305 735 L 305 708 L 358 708 L 358 810 L 255 810 Z" />
    
    <!-- Letter Y -->
    <path d="M 370 650 L 398 650 L 420 720 L 442 650 L 470 650 L 434 745 L 434 810 L 406 810 L 406 745 Z" />

    <!-- Letter M -->
    <path d="M 482 650 L 512 650 L 536 740 L 560 650 L 590 650 L 590 810 L 564 810 L 564 710 L 544 785 L 528 785 L 508 710 L 508 810 L 482 810 Z" />
  </g>
</svg>